spring:
  application:
    name: compliance-api
  profiles:
    # application-oauth.yml (compliance.oauth.client.providers.*) должен применяться ВСЕГДА,
    # не только при явной активации профиля oauth — иначе OAuthClientRegistrationConfig не видит
    # OAUTH_*_CLIENT_ID/SECRET из env, OAuthProvidersConfiguredCondition не срабатывает,
    # oauthSecurityFilterChain не создаётся, и /oauth2/authorization/{id} отвечает 401 из
    # основной JWT-цепочки вместо редиректа к провайдеру.
    include: oauth
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/compliance}
    username: ${DB_USERNAME:compliance}
    password: ${DB_PASSWORD:compliance}
    hikari:
      maximum-pool-size: 10
      # Прод-Postgres/firewall рвёт idle TCP раньше дефолтного maxLifetime (30 мин) → housekeeper
      # ловит «Соединение уже было закрыто». Ротируем коннект раньше серверного таймаута (4 мин) и
      # пингуем idle-коннекты (keepalive 2 мин), чтобы протухший коннект не дожил до выдачи из пула.
      max-lifetime: ${DB_MAX_LIFETIME_MS:240000}
      keepalive-time: ${DB_KEEPALIVE_MS:120000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # SASL/SCRAM auth (общая для producer/consumer/admin). По умолчанию PLAINTEXT = без авторизации
    # (локаль/дев). Прод: KAFKA_SECURITY_PROTOCOL=SASL_SSL, KAFKA_SASL_MECHANISM=SCRAM-SHA-512,
    # KAFKA_SASL_JAAS_CONFIG=org.apache.kafka.common.security.scram.ScramLoginModule required
    #   username="..." password="...";
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
      # Только при SASL_SSL с приватным/самоподписанным CA. Пусто = доверять системному cacerts.
      ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
      ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:compliance-api}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Сырые байты + ByteArrayJsonMessageConverter (MessagingConfig): тип из сигнатуры @KafkaListener
      # без type-headers. См. compliance-worker/application.yml — единый контракт api↔worker.
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      ack-mode: manual
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Auth/TLS Redis (RedisRateLimitService). По умолчанию пусто = без авторизации (локаль/дев).
      # Прод: REDIS_PASSWORD обязателен; REDIS_USERNAME — только для Redis 6+ ACL; REDIS_SSL_ENABLED
      # для rediss://. Пустой password → подключение без AUTH.
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

server:
  port: 8080
  # За nginx-проксированием (X-Forwarded-Proto/Host/For уже шлёт nginx, см. deploy/nginx
  # конфиг): без этого Spring строит абсолютные URL (в т.ч. OAuth2 authorization redirect)
  # из внутреннего server.port/host — получалось http://api:8080/oauth2/... вместо
  # https://okdocs.io/api/oauth2/..., недоступного браузеру снаружи docker-сети.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

compliance:
  kafka:
    topic:
      scan-requested: compliance.scan.requested
      scan-completed: compliance.scan.completed
      scan-failed: compliance.scan.failed
  rate-limit:
    guest-scans-per-ip-per-hour: 100
    user-scans-per-hour: 500
    # Анти-brute-force: попытки login/register/oauth-exchange с одного IP в час.
    # Refresh не лимитируется (256-бит токен + reuse-detection в AuthService).
    auth-attempts-per-ip-per-hour: ${AUTH_ATTEMPTS_PER_IP_PER_HOUR:30}
  scan:
    free-marketing-max-pages: 1
    guest-max-pages: 5
    user-max-pages: 100
    guest-retention-days: 7
    free-marketing-retention-days: 7
    # Юрисдикции с готовым набором правил (Этап 13). Скан/чекаут по другой юрисдикции → 400
    # (защита от «пустого идеального отчёта»).
    enabled-jurisdictions:
      - RU
      - EU
      - UK
      - DE
      - FR
      - ES
  plan:
    quota:
      FREE: 0
      PRO: 30
      BUSINESS: 200
  paywall-cta:
    title: "Откройте полный отчёт"
    text: "Получите доказательства, ссылки на закон, рекомендации и PDF-отчёт"
    action-url: "/payment"
  outbox:
    max-retries: 5
    batch-size: 100
    poll-interval-ms: 5000
    backoff-base: 10s
    backoff-max: 10m
  auth:
    jwt-secret: ${JWT_SECRET:change-me-in-production-this-must-be-at-least-256-bits-long-secret-key}
    access-token-ttl: 30m
    refresh-token-ttl: 30d
    guest-token-ttl: 7d
  security:
    # Доверять X-Forwarded-For только за доверенным ingress/proxy. По умолчанию false
    # (иначе guest-rate-limit по IP обходится подделкой заголовка).
    trust-forwarded-header: ${TRUST_FORWARDED_HEADER:false}
  oauth:
    # Фронтовый BFF-callback (Route Handler), куда после OAuth-login редиректим с one-time кодом
    # (F.8). Handler меняет code→JWT, ставит httpOnly cookie и уводит на /{locale}/dashboard.
    # {locale} подставляет success-handler из OAuth state; идёт query-параметром (путь — /api/*).
    success-redirect-url: ${OAUTH_SUCCESS_REDIRECT_URL:http://localhost:3000/api/auth/oauth/callback?locale={locale}}
  payment:
    # Shared-secret webhook'а оплаты: query-параметр token в webhook-URL, который регистрируется
    # в кабинете YooKassa (.../api/payments/webhooks/yookassa?token=<secret>) — кастомные header'ы
    # провайдер не поддерживает. Не задан → webhook fail-closed отвергает все запросы (защита от
    # подделки). Штатная подпись провайдера — F.16.
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}

# YooKassa (Balance-first payments, docs/PLAN-payments.md). Credentials только из env.
# Не заданы shop-id/secret-key → клиент не сконфигурирован, создание платежа упадёт явной ошибкой.
yookassa:
  api-base-url: ${YOOKASSA_API_BASE_URL:https://api.yookassa.ru/v3}
  shop-id: ${YOOKASSA_SHOP_ID:}
  secret-key: ${YOOKASSA_SECRET_KEY:}
  return-url: ${YOOKASSA_RETURN_URL:}
  # Allowlist хостов для override returnUrl из запроса (анти-open-redirect). Пусто → любой override
  # отвергается с 400; returnUrl без override берётся из return-url выше.
  allowed-return-hosts: ${YOOKASSA_ALLOWED_RETURN_HOSTS:localhost}
  test-mode: ${YOOKASSA_TEST_MODE:true}
  # Код ставки НДС для чека (54-ФЗ): 1 — без НДС, 2 — НДС 10%, 4 — НДС 20%.
  vat-code: ${YOOKASSA_VAT_CODE:1}
