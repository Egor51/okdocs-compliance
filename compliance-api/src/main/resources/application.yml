spring:
  application:
    name: compliance-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/compliance}
    username: ${DB_USERNAME:compliance}
    password: ${DB_PASSWORD:compliance}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:compliance-api}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.use.type.headers: false
        spring.json.trusted.packages: io.okdocs.compliance.contracts.*
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

compliance:
  kafka:
    topic:
      scan-requested: compliance.scan.requested
      scan-completed: compliance.scan.completed
      scan-failed: compliance.scan.failed
  rate-limit:
    guest-scans-per-ip-per-hour: 5
    user-scans-per-hour: 20
  scan:
    guest-max-pages: 5
    user-max-pages: 30
    guest-retention-days: 7
  plan:
    quota:
      FREE: 1
      PRO: 30
      BUSINESS: 200
  paywall-cta:
    title: "Откройте полный отчёт"
    text: "Получите доказательства, ссылки на закон, рекомендации и PDF-отчёт"
    action-url: "/payment"
  outbox:
    max-retries: 5
    batch-size: 100
    poll-interval-ms: 5000
    backoff-base: 10s
    backoff-max: 10m
  auth:
    jwt-secret: ${JWT_SECRET:change-me-in-production-this-must-be-at-least-256-bits-long-secret-key}
    access-token-ttl: 30m
    refresh-token-ttl: 30d
    guest-token-ttl: 7d
  security:
    # Доверять X-Forwarded-For только за доверенным ingress/proxy. По умолчанию false
    # (иначе guest-rate-limit по IP обходится подделкой заголовка).
    trust-forwarded-header: ${TRUST_FORWARDED_HEADER:false}
