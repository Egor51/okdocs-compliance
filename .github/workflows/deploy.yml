# Deploy: push в main → тесты → сборка образов в GHCR → выкладка на app-сервер по SSH.
#
# Селективный деплой по изменённым путям:
#   compliance-api/**    → пересобирается и перекатывается только контейнер api
#   compliance-worker/** → только worker
#   общие модули (contracts/persistence/messaging/rules, root pom),
#   Dockerfile'ы, docker-compose.deploy.yml, этот workflow → оба
#
# Образы: ghcr.io/<owner>/okdocs-compliance-api и ...-worker, теги latest + sha-<commit>.
#
# Требуемые secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST      — адрес app-сервера
#   DEPLOY_USER      — ssh-пользователь
#   DEPLOY_SSH_KEY   — приватный ключ (OpenSSH)
#   DEPLOY_PATH      — каталог деплоя на сервере (там лежат .env и secrets/)
#   DEPLOY_PORT      — (опционально) ssh-порт, по умолчанию 22
#
# Ручной запуск (workflow_dispatch) позволяет форсировать деплой обоих сервисов.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_api:
        description: 'Deploy api'
        type: boolean
        default: true
      deploy_worker:
        description: 'Deploy worker'
        type: boolean
        default: true

# Деплои не перекрываются и не отменяются на середине.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_api || steps.filter.outputs.api }}
      worker: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_worker || steps.filter.outputs.worker }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            shared: &shared
              - 'pom.xml'
              - 'compliance-contracts/**'
              - 'compliance-persistence/**'
              - 'compliance-messaging/**'
              - 'compliance-rules/**'
              - 'docker-compose.deploy.yml'
              - '.github/workflows/deploy.yml'
            api:
              - *shared
              - 'compliance-api/**'
            worker:
              - *shared
              - 'compliance-worker/**'

  test:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test affected modules
        env:
          SHARED: ${{ needs.changes.outputs.shared }}
          API: ${{ needs.changes.outputs.api }}
          WORKER: ${{ needs.changes.outputs.worker }}
        run: |
          if [ "$SHARED" = "true" ] || { [ "$API" = "true" ] && [ "$WORKER" = "true" ]; }; then
            mvn -B -ntp verify
          elif [ "$API" = "true" ]; then
            mvn -B -ntp -pl compliance-api -am verify
          else
            mvn -B -ntp -pl compliance-worker -am verify
          fi

  build-api:
    needs: [changes, test]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          # metadata-action сам приводит имя к lowercase для GHCR
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: compliance-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  build-worker:
    needs: [changes, test]
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-worker
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: compliance-worker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

  deploy:
    needs: [changes, build-api, build-worker]
    # Запускается, если хотя бы один образ собран и ничего не упало
    # (skipped-джобы не блокируют).
    if: >-
      !failure() && !cancelled() &&
      (needs.build-api.result == 'success' || needs.build-worker.result == 'success')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Sync compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "docker-compose.yml,docker-compose.prod.yml,docker-compose.deploy.yml"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Roll out changed services
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DEPLOY_API: ${{ needs.changes.outputs.api }}
          DEPLOY_WORKER: ${{ needs.changes.outputs.worker }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_USER,DEPLOY_API,DEPLOY_WORKER,DEPLOY_DIR
          script: |
            set -euo pipefail
            cd "$DEPLOY_DIR"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.deploy.yml"

            SERVICES=""
            [ "$DEPLOY_API" = "true" ] && SERVICES="$SERVICES api"
            [ "$DEPLOY_WORKER" = "true" ] && SERVICES="$SERVICES worker"
            echo "Deploying services:$SERVICES"

            pull_with_retry() {
              local service="$1"
              local attempt=1
              local max_attempts=3

              until $COMPOSE pull "$service"; do
                if [ "$attempt" -ge "$max_attempts" ]; then
                  echo "Failed to pull $service after $max_attempts attempts"
                  return 1
                fi

                local delay=$((attempt * 5))
                echo "Pull failed for $service (attempt $attempt/$max_attempts); retrying in ${delay}s"
                sleep "$delay"
                attempt=$((attempt + 1))
              done
            }

            [ "$DEPLOY_API" = "true" ] && pull_with_retry api
            [ "$DEPLOY_WORKER" = "true" ] && pull_with_retry worker
            $COMPOSE up -d $SERVICES

            docker image prune -f

            $COMPOSE ps
