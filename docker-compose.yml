# БАЗОВЫЙ compose: runtime-сервисы, которые поднимаются и в dev, и в prod.
#
# Dev:  docker compose up
#       docker-compose.override.yml подхватывается автоматически и добавляет
#       postgres/kafka/kafka-ui, dev-порты и небезопасные dev-дефолты.
#
# Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#       поднимаются только redis + browserless. Postgres и Kafka — внешние сервисы
#       на отдельных серверах, приложения подключаются к ним через env.
#
# Базовый файл не содержит postgres/kafka намеренно: они не являются частью prod
# runtime на этом хосте.

services:
  redis:
    image: redis:7-alpine
    # Базовый command — БЕЗ пароля (dev по умолчанию). Прод-оверрайд заменяет его на
    # redis-server --requirepass ${REDIS_PASSWORD:?} (там переменная обязательна).
    command: ["redis-server"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  browserless:
    image: ghcr.io/browserless/chromium:${BROWSERLESS_VERSION:-latest}
    restart: unless-stopped
    environment:
      # CDP HTTP endpoint. Токен общий с приложением (CDP_AUTH_TOKEN).
      TOKEN: ${CDP_AUTH_TOKEN:?set CDP_AUTH_TOKEN}
      HOST: 0.0.0.0
      PORT: 3000
      CONCURRENT: ${BROWSERLESS_CONCURRENT:-3}
      QUEUED: ${BROWSERLESS_QUEUED:-10}
      TIMEOUT: ${BROWSERLESS_TIMEOUT_MS:-30000}
      MAX_RECONNECT_TIME: ${BROWSERLESS_MAX_RECONNECT_TIME_MS:-300000}
      MAX_CPU_PERCENT: ${BROWSERLESS_MAX_CPU_PERCENT:-90}
      MAX_MEMORY_PERCENT: ${BROWSERLESS_MAX_MEMORY_PERCENT:-90}
      # Security defaults: токен-защита CDP, без доступа к локальным файлам.
      ALLOW_GET: ${BROWSERLESS_ALLOW_GET:-false}
      CORS: ${BROWSERLESS_CORS:-false}
      ALLOW_FILE_PROTOCOL: ${BROWSERLESS_ALLOW_FILE_PROTOCOL:-false}
      # Встроенный ad/tracker-blocklist Browserless ОБЯЗАН быть выключен: compliance-сканер сам
      # анализирует трекеры (pre-consent logic) и должен видеть реальные сетевые запросы. Хуже того,
      # blocklist режет и сам Document навигации, если домен сайта похож на рекламный/трекерный
      # (напр. *-traffic.online) → net::ERR_BLOCKED_BY_CLIENT и весь dynamic-проход падает.
      DISABLE_BLOCKLIST: ${BROWSERLESS_DISABLE_BLOCKLIST:-true}
      HEALTH: ${BROWSERLESS_HEALTH:-true}
      LOG_LEVEL: ${BROWSERLESS_LOG_LEVEL:-info}
      LOG_FORMAT: ${BROWSERLESS_LOG_FORMAT:-json}
      DEBUG: ${BROWSERLESS_DEBUG:-}
      TZ: ${TZ:-UTC}
    shm_size: "${BROWSERLESS_SHM_SIZE:-1gb}"
    healthcheck:
      # Токен берём из process.env внутри node, а НЕ интерполируем голым в JS: числовой токен
      # ломает парсер (SyntaxError: Identifier cannot follow number). TOKEN уже в env контейнера.
      test:
        - CMD-SHELL
        - >
          node -e "const t=process.env.TOKEN||'';
          fetch('http://127.0.0.1:3000/json/version?token='+encodeURIComponent(t),
          {headers:{Authorization:'Bearer '+t}})
          .then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: ${BROWSERLESS_HEALTH_INTERVAL:-10s}
      timeout: ${BROWSERLESS_HEALTH_TIMEOUT:-5s}
      retries: ${BROWSERLESS_HEALTH_RETRIES:-10}
      start_period: ${BROWSERLESS_HEALTH_START_PERIOD:-20s}
