# Локальная разработка: платный premium-поток (CDP/headless Chromium) не нужен. Дефолт
# premium-enabled=true (fail-fast в проде) уронил бы старт без доступного CDP — здесь явно
# выключаем, а enabled=false убирает саму зависимость от browserless (бин-заглушка
# NoopDynamicCrawler, см. CombinedContextIT). Включить локально: запустить browserless
# и поднять enabled + premium-enabled + CDP_* env.
spring:
  flyway:
    # Combined-app уже применил локальный dev-seed V900. Последующие продуктовые V0XX
    # закономерно ниже него, поэтому только в local разрешаем их out-of-order применение.
    out-of-order: true

compliance:
  crawler:
    dynamic:
      # Профильный YAML имеет приоритет над application.yml, поэтому literal false здесь
      # блокировал CDP_ENABLED/CDP_PREMIUM_ENABLED из базового файла. Оставляем безопасный
      # local-default false, но разрешаем явное включение Browserless через env.
      enabled: ${CDP_ENABLED:false}
      premium-enabled: ${CDP_PREMIUM_ENABLED:false}
