spring:
  application:
    name: compliance-app
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/compliance}
    username: ${DB_USERNAME:compliance}
    password: ${DB_PASSWORD:compliance}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: compliance-worker
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Сырые байты + ByteArrayJsonMessageConverter (MessagingConfig): тип из сигнатуры @KafkaListener
      # без type-headers. Единый контракт api↔worker в combined-процессе.
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      concurrency: 3
      ack-mode: manual

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

compliance:
  kafka:
    topic:
      scan-requested: compliance.scan.requested
      scan-completed: compliance.scan.completed
      scan-failed: compliance.scan.failed
  rate-limit:
    scans-per-ip-per-hour: 5
  crawler:
    max-pages: 20
    max-depth: 3
    page-timeout-ms: 15000
    crawler-timeout-seconds: 90
    rate-limit-ms: 1000
  geoip:
    db-path: ${GEOIP_DB_PATH:/opt/geoip/dbip-country-lite.mmdb}
