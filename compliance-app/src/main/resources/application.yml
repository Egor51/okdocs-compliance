spring:
  application:
    name: compliance-app
  # Combined api+worker — инструмент ЛОКАЛЬНОЙ разработки (§6). Дефолтный профиль local:
  #  - InMemoryRateLimitService вместо Redis (@Profile("local") в api), Redis не нужен;
  #  - application-local.yml выключает premium CDP (premium-enabled=false), браузер не нужен.
  # В проде api и worker деплоятся ОТДЕЛЬНО (combined-app не используется) — переопределить
  # профиль можно через SPRING_PROFILES_ACTIVE.
  profiles:
    default: local
  config:
    # Тот же core-yml, что импортирует standalone-worker — единый источник правды для
    # compliance.crawler/scan/score/dynamic/outbox. Combined-app не может разъехаться с
    # worker по таймаутам/score/CDP. Ниже — только api-блоки и env-специфика CDP.
    import: "classpath:application-compliance-core.yml"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/compliance}
    username: ${DB_USERNAME:compliance}
    password: ${DB_PASSWORD:compliance}
    hikari:
      maximum-pool-size: 10
      # Прод-Postgres/firewall рвёт idle TCP раньше дефолтного maxLifetime (30 мин) → housekeeper
      # ловит «Соединение уже было закрыто». Ротируем коннект раньше серверного таймаута (4 мин) и
      # пингуем idle-коннекты (keepalive 2 мин), чтобы протухший коннект не дожил до выдачи из пула.
      max-lifetime: ${DB_MAX_LIFETIME_MS:240000}
      keepalive-time: ${DB_KEEPALIVE_MS:120000}
  flyway:
    # Combined-app (локальный) дополнительно применяет dev-сид (db/migration-dev): юзер
    # user@local / pass с балансом 10. Standalone api/worker сканируют только db/migration —
    # dev-аккаунт в прод НЕ попадает (см. V900__dev_seed_user.sql).
    locations: classpath:db/migration,classpath:db/migration-dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # SASL/SCRAM auth (общая для producer/consumer/admin). Combined-app локальный → PLAINTEXT.
    # Прод деплоит api/worker отдельно; ручки оставлены для единообразия (см. их yml).
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
      # Только при SASL_SSL с приватным/самоподписанным CA. Пусто = доверять системному cacerts.
      ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
      ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      # Единый процесс — один consumer-group: api-часть (ScanResultListener) и worker-часть
      # (ScanRequestedListener) слушают разные топики, общий group-id безопасен.
      group-id: ${KAFKA_CONSUMER_GROUP:compliance-app}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Сырые байты + ByteArrayJsonMessageConverter (MessagingConfig): тип из сигнатуры @KafkaListener
      # без type-headers. Единый контракт api↔worker в combined-процессе.
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:6}
      ack-mode: manual
  data:
    redis:
      # Используется только при НЕ-local профиле (RedisRateLimitService). В local профиле
      # (дефолт combined-app) подключения к Redis нет.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    distribution:
      # Combined-app тоже регистрирует compliance.*-таймеры (через WorkerMetrics). Без этого
      # блока их histogram-бакеты не публикуются и p95 в Grafana/алертах пуст. Держим границы
      # СИНХРОННО с standalone-worker (application.yml воркера): иначе p95 разъедется между
      # деплоями. maximum 200s > total-deadline(3m) — чтобы p95 не упирался в дефолтные 30s.
      percentiles-histogram:
        compliance: true
      maximum-expected-value:
        compliance: 200s
      minimum-expected-value:
        compliance: 50ms

# Единый блок compliance.* для combined-процесса: ключи и api (ComplianceApiProperties), и worker
# (ComplianceWorkerProperties), и messaging (OutboxProperties). Оба биндят prefix=compliance по
# непересекающимся подключам и сосуществуют. Без auth.jwt-secret api-часть не стартует (дефолта в
# коде нет) — поэтому он здесь обязателен.
# compliance.kafka.topic / crawler / scan(worker) / score / geoip / outbox импортируются
# из application-compliance-core.yml (spring.config.import выше) — общие с standalone-worker.
# Ниже только то, что есть ЛИШЬ в combined-app: api-блоки (rate-limit/plan/paywall/auth),
# api-часть scan.* (per-principal лимиты), env-специфика CDP.
compliance:
  # ── api: анти-абьюз, продуктовые лимиты, тарифы, paywall, JWT ──────────────────
  rate-limit:
    guest-scans-per-ip-per-hour: 5
    user-scans-per-hour: 20
    # Анти-brute-force: попытки login/register/oauth-exchange с одного IP в час.
    # Refresh не лимитируется (256-бит токен + reuse-detection в AuthService).
    auth-attempts-per-ip-per-hour: ${AUTH_ATTEMPTS_PER_IP_PER_HOUR:30}
  scan:
    # api-флоу: лимиты страниц по принципалу + TTL короткоживущих сканов
    free-marketing-max-pages: 1
    guest-max-pages: 5
    user-max-pages: 100
    guest-retention-days: 7
    free-marketing-retention-days: 7
    # worker-часть scan.* (stale-after/redeliver-delay/total-deadline) — в core-yml.
  plan:
    quota:
      FREE: 0
      PRO: 30
      BUSINESS: 200
  paywall-cta:
    title: "Откройте полный отчёт"
    text: "Получите доказательства, ссылки на закон, рекомендации и PDF-отчёт"
    action-url: "/payment"
  auth:
    jwt-secret: ${JWT_SECRET:change-me-in-production-this-must-be-at-least-256-bits-long-secret-key}
    access-token-ttl: 30m
    refresh-token-ttl: 30d
    guest-token-ttl: 7d
  security:
    # Доверять X-Forwarded-For только за доверенным ingress/proxy (иначе guest-rate-limit
    # по IP обходится подделкой заголовка).
    trust-forwarded-header: ${TRUST_FORWARDED_HEADER:false}
  # ── worker: env-специфика CDP (всё остальное crawler/* — в core-yml) ──────────
  # Combined-app локально целит на свой browserless (env-дефолты отличаются от
  # standalone-worker), поэтому CDP-блок остаётся здесь, поверх импорта.
  crawler:
    dynamic:
      # CDP headless Chromium для CABINET_PREMIUM. Прод: enabled=true + base-url на browserless.
      # base-url — HTTP CDP-эндпоинт (http://browserless:3000), НЕ ws:// (см. isBaseUrlHttpScheme).
      enabled: ${CDP_ENABLED:true}
      base-url: ${CDP_BASE_URL:http://localhost:3000}
      auth-token: ${CDP_AUTH_TOKEN:local-cdp-token}
      # premium-enabled=true (дефолт, fail-fast) требует сконфигурированного И доступного CDP:
      # property-инвариант (isPremiumRequiresCdp) роняет старт без base-url, а CdpAvailabilityChecker
      # — если CDP-эндпоинт мёртв. Дефолтный профиль local (application-local.yml) ставит false.
      premium-enabled: ${CDP_PREMIUM_ENABLED:true}


