# ─────────────────────────────────────────────────────────────────────────────
# Единый источник правды для compliance.* worker-настроек (§5.7).
#
# Импортируется И standalone-worker'ом, И combined-app (spring.config.import в их
# application.yml). Цель — чтобы worker и app НЕ могли разъехаться по таймаутам,
# score-модели и CDP-настройкам: значение здесь одно, физически не дублируется.
#
# Если деплою НУЖНО осознанное отличие — он переопределяет конкретный ключ в своём
# application.yml ПОВЕРХ импорта, с комментарием «почему отличается». Молчаливого
# дубля (как было с crawler.max-pages: 20 vs 100) тут больше быть не может.
#
# Env-специфика (CDP base-url/auth-token/enabled, premium-enabled) остаётся в
# application.yml каждого приложения и профильных yml (local/test) — она по природе
# различается между деплоями.
# ─────────────────────────────────────────────────────────────────────────────
compliance:
  kafka:
    topic:
      scan-requested: compliance.scan.requested
      scan-completed: compliance.scan.completed
      scan-failed: compliance.scan.failed
  crawler:
    # Потолок страниц на скан. api шлёт per-principal лимит в строке скана
    # (user-max-pages и т.п.), SiteCrawler берёт min(scan.maxPages, этот потолок).
    max-pages: 100
    max-depth: 3
    page-timeout-ms: 15000
    # Отдельный (короткий) TCP-connect-таймаут: мёртвый seed (NoRouteToHost/refused) отваливается
    # быстро, не съедая page-timeout × число resolved-адресов на каждом приоритетном хинте.
    connect-timeout-ms: 4000
    crawler-timeout-seconds: 90
    # Вежливая пауза между запросами к сайту НА ОДИН ПОТОК. С concurrency=5 фактический rps ≈ 10
    # (5 потоков / 0.5с). Static-фетч теперь параллельный (см. concurrency).
    rate-limit-ms: 500
    # Параллельных fetch-потоков static-краула. Сам пул throttle'ит нагрузку на домен.
    concurrency: 5
    blocked-domains: []
    dynamic:
      # CDP-таймауты/лимиты dynamic-прохода. enabled/base-url/auth-token/premium-enabled
      # — env-специфика, задаются в application.yml каждого приложения, НЕ здесь.
      page-timeout-ms: 30000
      concurrency: 2
      # Сколько приоритетных страниц перекраулить headless поверх static-карты.
      # Должно быть <= crawler.max-pages (инвариант в ComplianceWorkerProperties).
      # CDP-проход — главный потребитель времени отчёта. Держим только самые ценные
      # приоритетные страницы (главная/политика/контакты/формы), чтобы premium не занимал
      # consumer lane на весь total-deadline и не задерживал быстрые FREE_MARKETING-сканы.
      max-pages: 4
      batch-timeout-seconds: 90
      # Как часто перепроверять живость CDP-эндпоинта между сканами.
      availability-recheck-interval: 10s
      network-idle:
        # «Тишина» сети quiet мс подряд считается концом динамической загрузки,
        # но ждём не дольше timeout мс (защита от long-polling/websocket).
        quiet-ms: 800
        timeout-ms: 2000
      pre-consent-tracking:
        # Наблюдение «трекер до согласия»: инжект MutationObserver фиксирует момент cookie-баннера,
        # таймлайн запросов — что грузилось раньше. false → краулер не инжектит наблюдатель и отдаёт
        # пустой preConsentTrackerHosts (правило остаётся на вероятностном UNVERIFIED). Откат-рубильник.
        enabled: true
      consent-scenarios:
        # Прогон consent-сценариев (Фаза 4): после снимка «до согласия» краулер кликает Reject, затем
        # Accept, фиксируя cookies/трекеры после каждого действия (вход для EU/UK consent-правил).
        # Best-effort, дороже по времени. В core-профиле включено, чтобы consent-правила получали
        # фактические сигналы баннера; аварийный откат — enabled=false.
        enabled: true
        wait-after-click-ms: 1500
  scan:
    # Порог reaper'а: скан без апдейта дольше этого срока считается зависшим.
    # Строго больше crawler.crawler-timeout-seconds (90s) — инвариант, fail-fast.
    stale-after: 5m
    # Задержка повторной доставки, когда скан уже идёт в другом потоке/инстансе.
    redeliver-delay: 30s
    # Жёсткий общий дедлайн на весь скан сверх crawler-таймаута (страховка от
    # зависания не в краулере). Не меньше crawler.crawler-timeout-seconds.
    total-deadline: 5m
  backfill:
    # Разовый backfill старых terminal-сканов без report snapshot. Включать только на время миграции.
    reports-enabled: ${REPORT_BACKFILL_ENABLED:false}
    batch-size: ${REPORT_BACKFILL_BATCH_SIZE:100}
    # После N падений один scan пропускается до рестарта worker, чтобы poison-запись не блокировала пачки.
    max-attempts: ${REPORT_BACKFILL_MAX_ATTEMPTS:3}
    fixed-delay-ms: ${REPORT_BACKFILL_FIXED_DELAY_MS:30000}
  score:
    # Score-модель сайта (§5.5): 100 − Σ(base[severity] × weight[verification]).
    # Вынесена сюда, чтобы тюнить риск-модель без пересборки и держать её единой
    # для worker и app. Все severity обязаны быть покрыты; веса в [0,1] — fail-fast.
    initial: 100
    base-points:
      CRITICAL: 30
      HIGH: 20
      MEDIUM: 12
      LOW: 5
    verification-weight:
      # CONFIRMED — подтверждено → 100%; DETECTED — техсигнал без юр-контекста → 65%;
      # DEFAULT — фолбэк для UNVERIFIED и null (паттерн-инференс) → 80%.
      CONFIRMED: 1.00
      DETECTED: 0.65
      DEFAULT: 0.80
  outbox:
    # Outbox relay (общий для api и worker). max-retries/batch-size/backoff читает
    # OutboxProperties (compliance-messaging); poll-interval-ms — @Scheduled в
    # OutboxPublisher напрямую (SpEL), поэтому держим его здесь, не в коде.
    max-retries: 10
    batch-size: 100
    poll-interval-ms: 5000
    backoff-base: 10s
    backoff-max: 10m
  geoip:
    db-path: ${GEOIP_DB_PATH:classpath:ip-db/dbip-country-lite-2026-06.mmdb}
