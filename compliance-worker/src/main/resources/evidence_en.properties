# Evidence templates (en) — PLAN-evidence-localization, Stage 3.
# key=template with {param} placeholders; lists/sets rendered as "a, b, c".
# Non-migrated rules (evidenceKey==null) are not here — they use plain fallback.

MISSING_HSTS=The Strict-Transport-Security header is missing on {page}.
MISSING_CSP=The Content-Security-Policy header is missing on {page}.
WEAK_CSP=The Content-Security-Policy on {page} contains unsafe directives: {items}.
WILDCARD_CORS={page} sets Access-Control-Allow-Origin: *.
WILDCARD_CORS_CREDS={page} sets Access-Control-Allow-Origin: * together with Access-Control-Allow-Credentials: true (critical configuration).
HTTPS_NOT_ENFORCED_REDIRECT=The response at {page} redirects back to http instead of https.
HTTPS_NOT_ENFORCED_PLAIN=The response at {page} is served over insecure http with no redirect to https.
MIXED_CONTENT_DETECTED=The HTTPS page {page} loads resources over http://: {items}.
TLS_CERT_UNTRUSTED=The TLS certificate for {host} failed trust validation: {error}.
TLS_HANDSHAKE_FAILED=The TLS handshake with {host} failed: {error}.
TLS_HANDSHAKE_FAILED_MAYBE_NETWORK=The TLS handshake with {host} failed: {error}. This may be a network issue — manual verification needed.
TLS_CERTIFICATE_EXPIRES_SOON=The TLS certificate for {host} expires in {daysLeft} days (valid until {until}).
TRACKING_COOKIES_BEFORE_CONSENT=Tracking cookies were set on {page} before consent: {items}.
LOCAL_STORAGE_TRACKING_BEFORE_CONSENT=Tracking keys were written to localStorage on {page} before consent: {items}.
COOKIE_WITHOUT_SECURE_FLAG=Cookies without the Secure flag on {page}: {items}.
SESSION_COOKIE_WITHOUT_HTTPONLY=Session cookies without HttpOnly on {page}: {items}.

# EU/UK/overlay detectors (Stage 5)
PRIVACY_NOTICE_ABSENT=No privacy notice link or text found in the site footer, navigation or page content.
EU_CONTROLLER_IDENTITY_MISSING=The site collects personal data but no data-controller identity or contact details were found.
EU_DATA_SUBJECT_RIGHTS_MISSING=No mention of data-subject rights (access, erasure, rectification, objection, etc.) was found in the site's privacy information.
EU_THIRD_COUNTRY_TRACKER_RISK=Third-country trackers loaded: {items}. These transfer personal data outside the EU/EEA.
EU_CONSENT_PRECHECKED_OR_DEFAULT_ON=Non-essential consent toggles are pre-checked / default-on in the cookie banner.{cmp}
TRACKERS_AFTER_REJECT=Trackers still loading after consent rejection: {items}.
EU_NON_ESSENTIAL_COOKIES_BEFORE_CONSENT=Tracking cookies present after consent rejection: {items}.
DE_TDDDG_TERMINAL_ACCESS_WITHOUT_CONSENT=Non-essential storage/access after consent rejection: {items}.
NO_REJECT_ABSENT=Banner has an accept option but no reject option.{cmp}
NO_REJECT_UNEQUAL=Reject option is not at the same level as accept (hidden behind extra steps).{cmp}
FR_CNIL_REJECT_ABSENT=No 'reject all' control on the first banner layer.{cmp}
FR_CNIL_REJECT_UNEQUAL=The reject control is less prominent than accept (extra steps required).{cmp}
ES_AEPD_REJECT_ABSENT=No 'Rechazar' control on the first banner layer.{cmp}
ES_AEPD_REJECT_UNEQUAL=The reject control is less accessible than accept.{cmp}
