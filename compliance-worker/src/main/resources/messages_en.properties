# RuleOutcome.message templates (en) — PLAN-evidence-localization, Stage 4.
# NOT_EVALUATED reasons; static (no params). messageKey==null -> plain fallback.

NOT_EVALUATED_DEFINITION_BROKEN=The rule could not be prepared for evaluation.
NOT_EVALUATED_NO_INPUT=The rule was not evaluated: no input data to check.
NOT_EVALUATED_NO_PAGES=The rule was not evaluated: the crawler returned no pages.
NOT_EVALUATED_RULE_ERROR=The rule was not evaluated due to an execution error.
NOT_EVALUATED_CONSENT_SCENARIO_DISABLED=The consent scenario is disabled by configuration.
NOT_EVALUATED_CONSENT_BANNER_NOT_FOUND=No cookie banner was found on the dynamically checked pages.
NOT_EVALUATED_CONSENT_REJECT_NOT_FOUND=A cookie banner was found, but no reject action was available.
NOT_EVALUATED_CONSENT_REJECT_CLICK_FAILED=The reject action was found, but the browser could not execute it.
NOT_EVALUATED_CONSENT_POST_REJECT_CAPTURE_FAILED=Reject was executed, but the post-reject state could not be captured.
NOT_EVALUATED_CONSENT_TIMEOUT=The consent scenario did not complete within the allowed time.
NOT_EVALUATED_CONSENT_CDP_ERROR=The consent scenario could not run because of a browser error.
