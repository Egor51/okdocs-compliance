# Evidence templates (ru) — PLAN-evidence-localization, Этап 3.
# key=template с плейсхолдерами {param}; списки/множества → "a, b, c".
# Немигрированные правила (evidenceKey==null) сюда не входят — у них plain fallback.

MISSING_HSTS=На странице {page} отсутствует заголовок Strict-Transport-Security.
MISSING_CSP=На странице {page} отсутствует заголовок Content-Security-Policy.
WEAK_CSP=Content-Security-Policy на странице {page} содержит небезопасные директивы: {items}.
WILDCARD_CORS=На странице {page} задан Access-Control-Allow-Origin: *.
WILDCARD_CORS_CREDS=На странице {page} задан Access-Control-Allow-Origin: * вместе с Access-Control-Allow-Credentials: true (критичная конфигурация).
HTTPS_NOT_ENFORCED_REDIRECT=Ответ по {page} перенаправляет снова на http, а не на https.
HTTPS_NOT_ENFORCED_PLAIN=Ответ по {page} отдаётся по незащищённому http без редиректа на https.
MIXED_CONTENT_DETECTED=HTTPS-страница {page} подключает ресурсы по http://: {items}.
TLS_CERT_UNTRUSTED=TLS-сертификат сайта {host} не прошёл проверку доверия: {error}.
TLS_HANDSHAKE_FAILED=TLS-рукопожатие с {host} не удалось: {error}.
TLS_HANDSHAKE_FAILED_MAYBE_NETWORK=TLS-рукопожатие с {host} не удалось: {error}. Возможна сетевая недоступность — требуется ручная проверка.
TLS_CERTIFICATE_EXPIRES_SOON=TLS-сертификат {host} истекает через {daysLeft} дн. (срок до {until}).
TRACKING_COOKIES_BEFORE_CONSENT=На странице {page} до согласия установлены трекинговые cookie: {items}.
LOCAL_STORAGE_TRACKING_BEFORE_CONSENT=На странице {page} до согласия записаны трекинговые ключи localStorage: {items}.
COOKIE_WITHOUT_SECURE_FLAG=На странице {page} cookie без флага Secure: {items}.
SESSION_COOKIE_WITHOUT_HTTPONLY=На странице {page} сессионная cookie без HttpOnly: {items}.
