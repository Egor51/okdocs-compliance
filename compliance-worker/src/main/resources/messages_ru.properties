# RuleOutcome.message templates (ru) — PLAN-evidence-localization, Этап 4.
# Причины NOT_EVALUATED; статичны (без params). messageKey==null → plain fallback.

NOT_EVALUATED_DEFINITION_BROKEN=Правило не удалось подготовить к проверке.
NOT_EVALUATED_NO_INPUT=Правило не проверялось: нет входных данных для проверки.
NOT_EVALUATED_NO_PAGES=Правило не проверялось: краулер не вернул страниц.
NOT_EVALUATED_RULE_ERROR=Правило не проверялось из-за ошибки выполнения.
NOT_EVALUATED_CONSENT_SCENARIO_DISABLED=Consent-сценарий отключён конфигурацией.
NOT_EVALUATED_CONSENT_BANNER_NOT_FOUND=Cookie-баннер не найден на проверенных динамических страницах.
NOT_EVALUATED_CONSENT_REJECT_NOT_FOUND=Cookie-баннер найден, но действие отказа не найдено.
NOT_EVALUATED_CONSENT_REJECT_CLICK_FAILED=Действие отказа найдено, но браузер не смог его выполнить.
NOT_EVALUATED_CONSENT_POST_REJECT_CAPTURE_FAILED=Отказ выполнен, но состояние после отказа снять не удалось.
NOT_EVALUATED_CONSENT_TIMEOUT=Consent-сценарий не завершился за отведённое время.
NOT_EVALUATED_CONSENT_CDP_ERROR=Consent-сценарий не выполнен из-за ошибки браузера.
