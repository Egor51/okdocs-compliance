# Локальная разработка: платный premium-поток (CDP/headless Chromium) не нужен. Дефолт
# premium-enabled=true (fail-fast в проде) уронил бы старт без доступного CDP — здесь явно
# выключаем. Включить локально: запустить browserless и поднять premium-enabled + CDP_* env.
compliance:
  crawler:
    dynamic:
      # Профильный YAML имеет приоритет над application.yml: значение должно само читать env,
      # иначе CDP_PREMIUM_ENABLED не может включить fail-fast проверку в local-профиле.
      premium-enabled: ${CDP_PREMIUM_ENABLED:false}
