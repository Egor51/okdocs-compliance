spring:
  application:
    name: compliance-worker
  config:
    # Единый источник правды для compliance.* (краулер/scan/score/dynamic/outbox).
    # Тот же файл импортирует combined-app — worker и app не могут разъехаться по
    # таймаутам/score/CDP. Здесь остаётся только worker-инфраструктура и env-специфика.
    import:
      - "classpath:application-domain-policy.yml"
      - "classpath:application-compliance-core.yml"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/compliance}
    username: ${DB_USERNAME:compliance}
    password: ${DB_PASSWORD:compliance}
    hikari:
      maximum-pool-size: 5
      # Прод-Postgres/firewall рвёт idle TCP раньше дефолтного maxLifetime (30 мин) → housekeeper
      # ловит «Соединение уже было закрыто». Ротируем коннект раньше серверного таймаута (4 мин) и
      # пингуем idle-коннекты (keepalive 2 мин), чтобы протухший коннект не дожил до выдачи из пула.
      max-lifetime: ${DB_MAX_LIFETIME_MS:240000}
      keepalive-time: ${DB_KEEPALIVE_MS:120000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # SASL/SCRAM auth (общая для producer/consumer/admin → под properties). По умолчанию PLAINTEXT
    # = без авторизации (локаль/дев). Прод: KAFKA_SECURITY_PROTOCOL=SASL_SSL (или SASL_PLAINTEXT),
    # KAFKA_SASL_MECHANISM=SCRAM-SHA-512, KAFKA_SASL_JAAS_CONFIG=
    #   org.apache.kafka.common.security.scram.ScramLoginModule required username="..." password="...";
    # При PLAINTEXT свойства sasl.* клиентом игнорируются (пустой jaas безопасен).
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
      # Только при SASL_SSL с приватным/самоподписанным CA. Пусто = доверять системному cacerts.
      ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
      ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    # Worker — НЕ только consumer: OutboxPublisher (§5.6) публикует ScanCompletedEvent/ScanFailedEvent.
    # Producer-сериализаторы обязательны, иначе outbox relay не сможет отправить события.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Тип не пишем в headers: consumer резолвит целевой тип по сигнатуре @KafkaListener
        # (single source of truth — параметр метода), а не по заголовку от producer'а.
        spring.json.add.type.headers: false
    consumer:
      group-id: compliance-worker
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Сырые байты + ByteArrayJsonMessageConverter (MessagingConfig): целевой тип берётся из
      # сигнатуры @KafkaListener, без type-headers от продюсера. JsonDeserializer тут не годится —
      # без headers он не знает тип и падает с «No type information in headers».
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:6}
      ack-mode: manual
#server:
#  port: 8081
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      # Common-теги на КАЖДОЙ метрике — нужны, когда несколько воркеров пушат в один
      # центральный Prometheus (иначе counter'ы инстансов сливаются). application — кто,
      # instance — какой именно процесс. INSTANCE_ID задаётся деплоем (k8s pod / compose
      # hostname); fallback на random UUID, чтобы при autoscale метки не схлопывались.
      application: ${spring.application.name}
      instance: ${INSTANCE_ID:${HOSTNAME:${random.uuid}}}
    distribution:
      # Публиковать histogram-бакеты (_bucket-серии) для compliance.*-таймеров. Без этого
      # Micrometer отдаёт только _count/_sum/_max, и histogram_quantile() в Grafana/алертах
      # (p95 фаз, enrichment, длительность скана) возвращает пусто. Бакеты считаются на стороне
      # воркера и агрегируются по инстансам в центральном Prometheus.
      percentiles-histogram:
        compliance: true
      # Верхняя граница бакетов. БЕЗ неё дефолтный верхний КОНЕЧНЫЙ бакет Timer'а = 30s, и
      # histogram_quantile() не может вернуть p95/p99 выше 30s — всё, что дольше (а скан идёт
      # до total-deadline 3m), схлопывается в +Inf и p95 «прилипает» к 30s, скрывая реальный
      # хвост. 200s > total-deadline(3m) → бакеты покрывают весь диапазон длительности скана.
      maximum-expected-value:
        compliance: 200s
      # Нижняя граница: enrichment-шаги (dns/rkn/tls) — десятки мс; 50ms убирает лишние
      # суб-миллисекундные бакеты, не теряя точность на реальном диапазоне.
      minimum-expected-value:
        compliance: 50ms

# compliance.* (краулер/scan/score/dynamic/outbox) импортируется из
# application-compliance-core.yml (см. spring.config.import выше). Здесь — только
# env-специфика CDP, которая по природе различается между деплоями.
compliance:
  crawler:
    dynamic:
      # CDP headless Chromium для CABINET_PREMIUM. Прод: enabled=true + base-url на browserless.
      # base-url — HTTP CDP-эндпоинт (http://browserless:3000), НЕ ws:// (см. isBaseUrlHttpScheme).
      enabled: ${CDP_ENABLED:true}
      base-url: ${CDP_BASE_URL:http://localhost:3000}
      auth-token: ${CDP_AUTH_TOKEN:local-cdp-token}
      # premium-enabled=true (дефолт, fail-fast) требует сконфигурированного И доступного CDP:
      # property-инвариант (isPremiumRequiresCdp) роняет старт без base-url, а CdpAvailabilityChecker
      # — если CDP-эндпоинт мёртв. Так обычный деплой не стартует с мёртвым платным потоком.
      # Локаль/стейдж без premium: профиль local / test-yml ставят premium-enabled=false.
      premium-enabled: ${CDP_PREMIUM_ENABLED:true}
