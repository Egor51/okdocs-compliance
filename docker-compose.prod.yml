# PROD-оверрайд. НЕ подхватывается автоматически — запуск явно:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Отличия от dev: поднимаются только локальные runtime-зависимости этого хоста:
# Redis (с AUTH) и browserless. Postgres и Kafka живут на отдельных серверах и
# передаются приложениям через env (DB_URL/KAFKA_BOOTSTRAP_SERVERS/KAFKA_SASL_*).
# Порты наружу не пробрасываются.
#
# Перед запуском задать в окружении (например через secrets, НЕ коммитить):
#   REDIS_PASSWORD, CDP_AUTH_TOKEN

services:
  redis:
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  browserless:
    restart: unless-stopped
    # Порт наружу не пробрасываем: CDP дергает только worker во внутренней сети.


