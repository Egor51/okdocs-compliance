# Центральный Prometheus (этап D). Метрики приходят PUSH'ем через remote_write от Alloy-
# сайдкаров воркеров (--web.enable-remote-write-receiver, см. compose). Здесь НЕТ scrape_configs
# для воркеров — они за NAT, центр их не достаёт; единственный источник серий воркеров — приём
# remote_write. Скрейпим только себя (мета-мониторинг самого Prometheus).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
